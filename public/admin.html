<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Moderación</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .grid { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 24px; align-items: start; }
    .grid > * { min-width: 0; }
    @media (max-width: 880px) { .grid { grid-template-columns: minmax(0, 1fr); } }
    .talks { list-style: none; padding: 0; margin: 0; }
    .talk { background: #fff; border: 1.5px solid var(--line); border-radius: var(--radius); padding: 12px 14px; cursor: pointer; position: relative; }
    .talk + .talk { margin-top: 10px; }
    .talk:hover { border-color: var(--lilac); }
    .talk.selected { border: 2px solid var(--purple); padding: 11.5px 13.5px; }
    .talk.active::before { content: ""; position: absolute; left: -1.5px; top: 10px; bottom: 10px; width: 4px; background: var(--coral); border-radius: 0 4px 4px 0; }
    .talk-num { flex: none; width: 30px; height: 30px; border-radius: 50%; background: var(--purple); color: #fff; font-weight: 700; font-size: 13px; display: grid; place-items: center; }
    .talk-title { font-weight: 700; font-size: 14px; overflow-wrap: anywhere; }
    .icon-btn { padding: 2px 9px; font-size: 13px; }
    .tabs { display: inline-flex; gap: 4px; padding: 4px; background: #fff; border: 1.5px solid var(--line); border-radius: 99px; flex-wrap: wrap; }
    .tab { border: 0; padding: 7px 16px; color: var(--slate); }
    .tab:hover:not(:disabled) { background: var(--lilac-soft); color: var(--purple); }
    .tab.on, .tab.on:hover:not(:disabled) { background: var(--navy); color: #fff; }
    .tab .n { display: inline-block; min-width: 20px; margin-left: 6px; padding: 0 6px; border-radius: 99px; background: rgba(0,0,0,.08); font-size: 12px; }
    .tab.on .n { background: rgba(255,255,255,.2); }
    .votes { flex: none; width: 52px; height: 52px; border-radius: 50%; background: var(--purple); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 10px; line-height: 1.1; }
    .votes strong { font-size: 17px; }
    .actions { margin-top: 12px; }
    .panel-actions { display: flex; gap: 8px; flex-wrap: wrap; padding: 14px 20px 0; }
    .add-talk { padding: 14px 16px; }
    .add-talk summary { cursor: pointer; font-weight: 700; color: var(--navy); list-style: none; }
    .add-talk summary::-webkit-details-marker { display: none; }
    .q-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 24px; }
    .q-head .tabs { margin-left: auto; }
    .tab { white-space: nowrap; }
    @media (max-width: 880px) {
      .grid { gap: 20px; }
      /* ponencias como tira horizontal deslizable */
      .talks { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 2px 2px 8px; margin: 0 -14px; padding-left: 14px; padding-right: 14px; }
      .talk { flex: 0 0 min(280px, 78vw); scroll-snap-align: start; }
      .talk + .talk { margin-top: 0; }
      .talks > .empty { flex: 1; }
      .q-head .tabs { margin-left: 0; width: 100%; display: flex; flex-wrap: nowrap; overflow-x: auto; }
      .q-head .tab { flex: 1 0 auto; }
    }
    @media (max-width: 640px) {
      .panel-actions { padding: 12px 14px 0; }
      .panel-actions button { flex: 1 1 auto; }
      .q .actions button { flex: 1 1 auto; }
    }
    #login-wrap { max-width: 420px; margin: 0 auto; padding: 0 16px; }
    #login { margin-top: 10vh; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <small>Panel de moderación</small>
        <strong id="event-name">Congreso</strong>
      </div>
      <span class="live-pill" id="live-pill" hidden><span class="dot" id="live-dot"></span><span id="live-text">Conectando…</span></span>
      <div class="top-actions" id="top-actions" hidden>
        <button class="ghost icon-btn" id="rename" title="Cambiar nombre del evento">Editar nombre</button>
        <a href="/" target="_blank">Ver página pública ↗</a>
        <button class="ghost icon-btn" id="logout">Salir</button>
      </div>
    </div>
  </header>

  <div id="login-wrap">
    <section id="login" class="card sky stack" hidden>
      <div class="eyebrow">Acceso</div>
      <h2>Panel de moderación</h2>
      <form id="login-form" class="stack">
        <div class="row" style="flex-wrap:nowrap">
          <input id="pin" type="password" placeholder="PIN de administrador" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" required />
          <button type="button" id="show-pin" class="icon-btn">Ver</button>
        </div>
        <button class="coral wide">Entrar</button>
      </form>
      <div id="login-err" class="notice err" hidden></div>
    </section>
  </div>

  <main id="app" class="wrap wide stack" hidden>
    <div id="error" class="notice err" hidden></div>

    <div class="grid">
      <section class="stack">
        <div>
          <div class="eyebrow">Programa</div>
          <h2 class="section-title" style="margin-top:4px">Ponencias</h2>
        </div>
        <details class="card sky add-talk" id="add-talk">
          <summary>＋ Añadir ponencia</summary>
          <form id="talk-form" class="stack" style="margin-top:12px">
            <input id="talk-title" placeholder="Título de la ponencia" required maxlength="160" />
            <input id="talk-speaker" placeholder="Ponente" maxlength="120" />
            <button class="navy">Añadir ponencia</button>
          </form>
        </details>
        <ul class="talks" id="talks"></ul>
      </section>

      <section class="stack">
        <div id="talk-panel"></div>
        <div class="q-head">
          <h2 class="section-title" style="font-size:22px">Preguntas <b>del público</b></h2>
          <div class="tabs" id="tabs"></div>
        </div>
        <ul class="q-list" id="questions"></ul>
      </section>
    </div>
  </main>

  <script type="module">
    import { $, esc, timeAgo, liveSocket } from "/app.js";

    const TABS = [
      ["pending", "Pendientes"],
      ["approved", "Publicadas"],
      ["answered", "Respondidas"],
      ["hidden", "Ocultas"],
    ];
    let pin = sessionStorage.getItem("pin") || "";
    let state = null;
    let selectedTalk = null;
    let tab = "pending";
    let socket = null;
    let armedDelete = null;

    async function api(method, path, body) {
      const res = await fetch(`/api/admin${path}`, {
        method,
        headers: { "content-type": "application/json", "x-admin-pin": pin },
        body: body ? JSON.stringify(body) : undefined,
      });
      const data = await res.json().catch(() => ({}));
      if (res.status === 401) { logout(); throw new Error("PIN incorrecto"); }
      if (!res.ok) throw new Error(data.error || "Error");
      return data;
    }

    async function act(method, path, body) {
      try {
        $("#error").hidden = true;
        await api(method, path, body);
      } catch (err) {
        $("#error").textContent = err.message;
        $("#error").hidden = false;
      }
    }

    function aiBadge(flag) {
      if (!flag) return "";
      if (flag === "checking") return ` · <span class="badge">🤖 revisando…</span>`;
      if (flag === "ok") return ` · <span class="badge ok">🤖 OK</span>`;
      if (flag === "error") return ` · <span class="badge warn">🤖 sin revisar (error IA)</span>`;
      return ` · <span class="badge danger">🤖 Bloqueada: ${esc(flag)}</span>`;
    }

    function render() {
      if (!state) return;
      $("#event-name").textContent = state.eventName;
      if (selectedTalk && !state.talks.some((t) => t.id === selectedTalk)) selectedTalk = null;
      if (!selectedTalk) selectedTalk = state.activeTalkId ?? state.talks[0]?.id ?? null;

      // Ponencias
      if (!state.talks.length) $("#add-talk").open = true;
      $("#talks").innerHTML = state.talks.length ? state.talks.map((t, i) => {
        const active = t.id === state.activeTalkId;
        return `<li class="talk ${active ? "active" : ""} ${t.id === selectedTalk ? "selected" : ""}" data-id="${t.id}">
          <div class="row" style="flex-wrap:nowrap;align-items:flex-start;gap:10px">
            <span class="talk-num">${i + 1}</span>
            <div style="flex:1;min-width:0">
              <div class="talk-title">${esc(t.title)}</div>
              <div class="muted" style="font-size:13px">${esc(t.speaker) || "&nbsp;"}</div>
            </div>
            <div class="row" style="gap:4px;flex-wrap:nowrap">
              <button class="icon-btn" data-move="up" ${i === 0 ? "disabled" : ""} title="Subir">↑</button>
              <button class="icon-btn" data-move="down" ${i === state.talks.length - 1 ? "disabled" : ""} title="Bajar">↓</button>
            </div>
          </div>
          <div class="row" style="margin-top:8px;gap:6px;padding-left:40px">
            ${active ? `<span class="badge live">● EN VIVO</span>` : ""}
            ${t.pending ? `<span class="badge warn">${t.pending} pendientes</span>` : ""}
            ${t.approved ? `<span class="badge accent">${t.approved} publicadas</span>` : ""}
          </div>
        </li>`;
      }).join("") : `<li class="card plain empty">Añade la primera ponencia del programa.</li>`;

      // Panel de la ponencia seleccionada
      const talk = state.talks.find((t) => t.id === selectedTalk);
      if (!talk) {
        $("#talk-panel").innerHTML = `<div class="card plain empty">Crea una ponencia a la izquierda para empezar.</div>`;
        $("#tabs").innerHTML = "";
        $("#questions").innerHTML = "";
        return;
      }
      const isActive = talk.id === state.activeTalkId;
      $("#talk-panel").innerHTML = `
        <div class="hero" style="margin-top:0">
          <div class="hero-kicker">${isActive ? "● En vivo · abierta a preguntas" : "Cerrada"}</div>
          <div class="hero-band ${isActive ? "" : "idle"}"><h1>${esc(talk.title)}</h1></div>
          ${talk.speaker ? `<div class="hero-sub">Ponente: <strong>${esc(talk.speaker)}</strong></div>` : ""}
          <div class="panel-actions">
            ${isActive
              ? `<button class="navy" id="close-talk">Cerrar preguntas</button>`
              : `<button class="coral" id="open-talk">Abrir preguntas</button>`}
            <button id="edit-talk">Editar</button>
            <button class="danger" id="delete-talk">${armedDelete === talk.id ? "¿Seguro? Borrar todo" : "Eliminar"}</button>
          </div>
          ${!isActive && state.activeTalkId ? `<div class="muted" style="font-size:13px;padding:10px 20px 0">Abrir esta ponencia cerrará la que está en vivo ahora.</div>` : ""}
        </div>`;

      const qs = state.questions.filter((q) => q.talk_id === talk.id);
      $("#tabs").innerHTML = TABS.map(([key, label]) => {
        const n = qs.filter((q) => q.status === key).length;
        return `<button class="tab ${tab === key ? "on" : ""}" data-tab="${key}">${label}<span class="n">${n}</span></button>`;
      }).join("");

      const shown = qs.filter((q) => q.status === tab);
      const buttons = {
        pending: [["approved", "Publicar", "coral"], ["hidden", "Ocultar"]],
        approved: [["answered", "Marcar respondida", "navy"], ["pending", "Despublicar"], ["hidden", "Ocultar"]],
        answered: [["approved", "Volver a publicadas"]],
        hidden: [["pending", "Restaurar a pendientes"], ["approved", "Publicar", "coral"]],
      }[tab];
      $("#questions").innerHTML = shown.length ? shown.map((q) => `
        <li class="card q">
          <div class="votes"><strong>${q.votes}</strong>votos</div>
          <div style="flex:1;min-width:0">
            <div class="q-text">${esc(q.text)}</div>
            <div class="q-meta">${q.author ? esc(q.author) : "Anónimo"} · ${timeAgo(q.created_at)}
              ${aiBadge(q.ai_flag)}</div>
            <div class="row actions">
              ${buttons.map(([s, l, cls]) => `<button class="small ${cls || ""}" data-q="${q.id}" data-status="${s}">${l}</button>`).join("")}
            </div>
          </div>
        </li>`).join("") : `<li class="card plain empty">No hay preguntas en esta sección.</li>`;
    }

    // ---- eventos ----
    $("#talk-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      await act("POST", "/talks", { title: $("#talk-title").value, speaker: $("#talk-speaker").value });
      $("#talk-title").value = "";
      $("#talk-speaker").value = "";
      $("#talk-title").focus();
    });

    $("#talks").addEventListener("click", (e) => {
      const li = e.target.closest(".talk");
      if (!li) return;
      const id = Number(li.dataset.id);
      const move = e.target.closest("[data-move]");
      if (move) return act("POST", `/talks/${id}/move`, { direction: move.dataset.move });
      selectedTalk = id;
      armedDelete = null;
      render();
    });

    $("#talk-panel").addEventListener("click", (e) => {
      const id = selectedTalk;
      if (e.target.id === "open-talk") { tab = "pending"; act("POST", `/talks/${id}/activate`); }
      if (e.target.id === "close-talk") act("POST", "/close");
      if (e.target.id === "edit-talk") {
        const t = state.talks.find((x) => x.id === id);
        const title = prompt("Título de la ponencia", t.title);
        if (title === null) return;
        const speaker = prompt("Ponente", t.speaker);
        if (speaker === null) return;
        act("PATCH", `/talks/${id}`, { title, speaker });
      }
      if (e.target.id === "delete-talk") {
        if (armedDelete === id) { armedDelete = null; act("DELETE", `/talks/${id}`); }
        else { armedDelete = id; render(); setTimeout(() => { if (armedDelete === id) { armedDelete = null; render(); } }, 4000); }
      }
    });

    $("#tabs").addEventListener("click", (e) => {
      const b = e.target.closest("[data-tab]");
      if (b) { tab = b.dataset.tab; render(); }
    });

    $("#questions").addEventListener("click", (e) => {
      const b = e.target.closest("[data-q]");
      if (b) { b.disabled = true; act("POST", `/questions/${b.dataset.q}`, { status: b.dataset.status }); }
    });

    $("#rename").addEventListener("click", () => {
      const name = prompt("Nombre del evento", state?.eventName || "");
      if (name) act("POST", "/settings", { eventName: name });
    });

    // ---- sesión ----
    function logout() {
      pin = "";
      sessionStorage.removeItem("pin");
      socket?.close();
      socket = null;
      $("#app").hidden = true;
      $("#login").hidden = false;
      setChrome(false);
    }
    function setChrome(on) {
      for (const id of ["#live-pill", "#top-actions"]) $(id).hidden = !on;
    }
    $("#logout").addEventListener("click", logout);

    async function start() {
      try {
        state = await api("GET", "/state");
      } catch (err) {
        $("#login").hidden = false;
        if (pin) { $("#login-err").textContent = err.message; $("#login-err").hidden = false; }
        return;
      }
      sessionStorage.setItem("pin", pin);
      $("#login").hidden = true;
      $("#login-err").hidden = true;
      $("#app").hidden = false;
      setChrome(true);
      render();
      socket = liveSocket(`/ws?role=admin&pin=${encodeURIComponent(pin)}`, {
        onState: (s) => { state = s; render(); },
        onStatus: (live) => {
          $("#live-dot").classList.toggle("live", live);
          $("#live-text").textContent = live ? "En vivo" : "Reconectando…";
        },
      });
    }

    $("#login-form").addEventListener("submit", (e) => {
      e.preventDefault();
      pin = $("#pin").value.replace(/\s+/g, "").replace(/%$/, "");
      start();
    });

    $("#show-pin").addEventListener("click", () => {
      const input = $("#pin");
      input.type = input.type === "password" ? "text" : "password";
      $("#show-pin").textContent = input.type === "password" ? "Ver" : "Ocultar";
    });

    if (pin) start(); else $("#login").hidden = false;
    setInterval(render, 60000);
  </script>
</body>
</html>
